name: Blog autopilot

# FULL-AUTO : génère un article, le passe à la gate qualité, et le PUBLIE tout seul
# si score ≥56/70 sans bloquant. Aucune validation, aucune notification sur publication.
# Si la gate ne passe pas → article jeté en silence (sujet sorti de la file).
# Alerte GitHub UNIQUEMENT si le système plante (clé API, quota, publication cassée).

on:
  schedule:
    - cron: '0 5 * * 1,2,4,5'   # lun + mar + jeu + ven, 5h UTC = 7h Paris (4 articles/semaine)
  workflow_dispatch:         # déclenchement manuel depuis l'onglet Actions

# jamais 2 runs en parallèle (anti-emballement)
concurrency:
  group: blog-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # KILL SWITCH : régler la variable repo BLOG_AUTOPILOT sur 'off' pour mettre en pause
    if: ${{ vars.BLOG_AUTOPILOT != 'off' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # historique complet → rebase fiable en cas de collision de push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'   # OG générée par sharp (pur Node), aucun navigateur requis
        run: npm ci

      - name: Génère + publie (si la gate passe)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE }}   # tolère le secret nommé CLAUDE (fallback)
        run: |
          node scripts/blog/autopilot.mjs
          {
            echo "status=$(sed -n '1p' /tmp/autopilot-status.txt)"
            echo "slug=$(sed -n '2p' /tmp/autopilot-status.txt)"
            echo "type=$(sed -n '3p' /tmp/autopilot-status.txt)"
            echo "url=$(sed -n '5p' /tmp/autopilot-status.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Commit + push (si publié)
        if: steps.gen.outputs.status == 'published'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Checkout CI vierge (origin/main) → git add -A ne capture QUE les artefacts de publication
          # (article HTML, articles.html, sitemap, RSS, OG, draft, topic-queue). research/ est gitignoré.
          git add -A
          if git diff --cached --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "feat(blog): publie '${{ steps.gen.outputs.slug }}' ($(date -u +%Y-%m-%d)) [auto]"
          # push robuste : rebase + retry (évite les collisions concurrentes avec daily-news-summary sur main)
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push refusé (collision concurrente ?) — rebase puis retry $i/5"
            git pull --rebase origin main || { echo "Rebase impossible"; exit 1; }
            sleep 3
          done
          echo "Push définitivement échoué après 5 tentatives"; exit 1

      - name: Ping IndexNow (si publié)
        if: steps.gen.outputs.status == 'published' && steps.gen.outputs.url != ''
        continue-on-error: true
        run: node scripts/indexnow-ping.js "${{ steps.gen.outputs.url }}"

      - name: Notifie la publication (email)
        if: steps.gen.outputs.status == 'published'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
        run: node scripts/blog/notify-publish.mjs "${{ steps.gen.outputs.slug }}" "${{ steps.gen.outputs.url }}"

      - name: Alerte si panne
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="⚠️ Blog autopilot en panne"
          body="Le pilote auto a échoué le $(date -u +%Y-%m-%dT%H:%MZ).
          Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Causes probables : secret GEMINI_API_KEY / ANTHROPIC_API_KEY (ou CLAUDE) manquant ou expiré, quota Gemini épuisé, file de sujets vide, ou étape de publication cassée.

          (Rappel : aucune alerte n'est envoyée quand un article est publié, ni quand la gate écarte volontairement un article jugé trop faible — c'est le fonctionnement normal.)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
