<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover : indispensable pour exploiter les safe-area iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jerwis News</title>
<meta name="description" content="Le résumé du jour en 30 secondes et les actus IA + Business.">
<!-- Outil personnel : rien à indexer -->
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="/app/manifest.webmanifest">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">

<!-- iOS : plein écran + barre de statut fondue dans le header -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jerwis News">
<link rel="apple-touch-icon" href="/photos/app-icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preload" href="/assets/fonts/archivo-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/app/app.css?v=1">
</head>
<body>

<header class="hdr">
  <span class="hdr-mark"><span class="hdr-dot" aria-hidden="true"></span>Jerwis News</span>
  <span class="hdr-age" id="age" aria-live="polite"></span>
  <button class="hdr-btn" id="refresh" type="button" aria-label="Rafraîchir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
    </svg>
  </button>
</header>

<div class="ptr" id="ptr">Relâche pour rafraîchir</div>

<p class="offline">Hors ligne — tu lis la dernière version enregistrée.</p>

<!-- Résumé du jour (data/news-summary.json, écrit chaque matin par le cron) -->
<section class="digest" id="digest" hidden>
  <div class="digest-kicker"><span id="digest-day">Aujourd'hui en 30 secondes</span></div>
  <div id="digest-items"></div>
</section>

<nav class="filters" id="filters" aria-label="Filtrer par catégorie">
  <button class="chip" type="button" data-cat="all" aria-pressed="true">Tout <span class="chip-n" id="n-all"></span></button>
  <button class="chip" type="button" data-cat="IA" aria-pressed="false">IA <span class="chip-n" id="n-ia"></span></button>
  <button class="chip" type="button" data-cat="Business" aria-pressed="false">Business <span class="chip-n" id="n-bu"></span></button>
  <button class="chip" type="button" data-cat="unread" aria-pressed="false">Non lus</button>
</nav>

<main class="feed" id="feed">
  <div class="skeleton"><div style="flex:1"><div class="sk-line" style="width:35%;margin-bottom:9px"></div><div class="sk-line" style="width:92%;margin-bottom:7px"></div><div class="sk-line" style="width:70%"></div></div><div class="sk-thumb"></div></div>
  <div class="skeleton"><div style="flex:1"><div class="sk-line" style="width:28%;margin-bottom:9px"></div><div class="sk-line" style="width:88%;margin-bottom:7px"></div><div class="sk-line" style="width:60%"></div></div><div class="sk-thumb"></div></div>
  <div class="skeleton"><div style="flex:1"><div class="sk-line" style="width:32%;margin-bottom:9px"></div><div class="sk-line" style="width:95%;margin-bottom:7px"></div><div class="sk-line" style="width:66%"></div></div><div class="sk-thumb"></div></div>
</main>

<div class="foot">
  <button class="foot-btn" id="mark-all" type="button">Tout marquer comme lu</button>
  <button class="foot-btn" id="notif" type="button" hidden>Activer la notif du matin</button>
</div>

<!-- Abonnement push : app perso mono-utilisateur, donc pas de base de données.
     L'abonnement est collé une fois dans le secret GitHub PUSH_SUBSCRIPTION. -->
<section class="sub" id="sub" hidden>
  <p class="sub-txt">Notifications autorisées. Dernière étape, une seule fois : colle ce texte dans le secret GitHub <code>PUSH_SUBSCRIPTION</code>.</p>
  <textarea class="sub-json" id="sub-json" readonly rows="4" spellcheck="false"></textarea>
  <div class="sub-actions">
    <button class="foot-btn" id="sub-copy" type="button">Copier</button>
    <button class="foot-btn" id="sub-close" type="button">Fermer</button>
  </div>
</section>

<script src="/app/app.js?v=1" defer></script>
</body>
</html>
